# DigitalOcean App Platform — static site spec for Speak Up.
#
# Create the app once from this file:
#   doctl apps create --spec .do/app.yaml
# Update it after editing:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Set BLOG_API_TOKEN as an encrypted secret in the App Platform UI (or with
# `doctl`) rather than committing it here.

name: speakup-site
region: fra # Frankfurt — closest region to Albania

static_sites:
  - name: web
    # Point this at the repository holding this project.
    github:
      repo: ElioFezollari/SpeakUpNew
      branch: main
      # App Platform rebuilds on every push to `branch`. Publishing a blog
      # post does not push, so the admin triggers a rebuild through the API
      # instead — see docs/DEPLOY-DIGITALOCEAN.md.
      deploy_on_push: true

    build_command: npm ci && npm run build
    output_dir: dist
    # Serve /404.html for unmatched paths.
    catchall_document: 404.html

    envs:
      - key: BLOG_API_URL
        scope: BUILD_TIME
        value: https://admin.klinikelogopedie.com/api/posts

      # BLOG_API_TOKEN is optional and left unset on purpose: the posts
      # endpoint only ever returns published content, so an open read is
      # defensible and one fewer thing to get wrong on a first deploy.
      # If you do set it, set the SAME value on the admin, or every build
      # fails with a 401. Add it in the UI as an encrypted secret rather
      # than committing the plaintext:
      #   Settings -> web -> Environment Variables -> Encrypt

      # Public by design: the contact form is submitted from the browser, so
      # this URL is emitted into the page HTML. Not a secret.
      - key: PUBLIC_CONTACT_API_URL
        scope: BUILD_TIME
        value: https://admin.klinikelogopedie.com/api/enquiries

      # Also public by design: the booking calendar is read and written from
      # the browser at runtime.
      - key: PUBLIC_BOOKING_API_URL
        scope: BUILD_TIME
        value: https://admin.klinikelogopedie.com/api/booking

      - key: SITE_URL
        scope: BUILD_TIME
        value: https://klinikelogopedie.com

    routes:
      - path: /

domains:
  - domain: klinikelogopedie.com
    type: PRIMARY
  - domain: www.klinikelogopedie.com
    type: ALIAS
