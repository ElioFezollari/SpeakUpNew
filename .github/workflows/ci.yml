name: CI

# Verifies the site type-checks and builds on every push and pull request,
# then deploys a push to main.
#
# The check builds against bundled fixtures rather than the live admin API, so
# a pull request never fails because the admin happens to be down. The build
# that actually ships is the one on the Droplet, against the real API over
# loopback — see SpeakUpAdmin/docs/DEPLOY-DROPLET.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Queued rather than cancelled: a skipped deploy would
# leave main unpublished with nothing to say so.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check
        env:
          BLOG_ALLOW_FIXTURES: '1'

      - name: Build
        run: npm run build
        env:
          BLOG_ALLOW_FIXTURES: '1'
          SITE_URL: https://klinikelogopedie.com
          PUBLIC_CONTACT_API_URL: https://admin.klinikelogopedie.com/api/enquiries
          PUBLIC_BOOKING_API_URL: https://admin.klinikelogopedie.com/api/booking

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The SSH secrets live on this environment. A job that does not name it
    # cannot see environment secrets at all — they arrive empty, which is
    # indistinguishable from never having been set.
    #
    # Naming it costs nothing if the secrets are repository-level instead:
    # those stay visible either way, and an environment secret of the same
    # name simply wins. It also buys a deployment history, and a place to
    # require a reviewer before anything reaches production.
    environment: prod

    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Name the ones that are actually missing. An empty value and an
          # absent secret look identical here, so "one of these four" sends you
          # to re-check all four.
          missing=""
          [ -n "$SSH_HOST" ]        || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ]        || missing="$missing SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing SSH_KNOWN_HOSTS"

          if [ -n "$missing" ]; then
            echo "::error::Empty or missing repository secrets:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions -> Secrets"
            echo "(the *Secrets* tab, not Variables; a Repository secret, not an Environment one)."
            echo "Names are case-sensitive. This repository is ${{ github.repository }}."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          # Pinned, not discovered. `ssh-keyscan` at deploy time would trust
          # whatever answers, which is the whole thing host keys exist to stop.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # The word "deploy" is discarded: this key is installed on the server
          # with a forced command, so the session can run deploy-site.sh and
          # nothing else. That script pulls, installs, rebuilds into a new
          # release directory and moves the symlink only if the build worked.
          ssh -i ~/.ssh/id_ci -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" deploy

      - name: Say what shipped
        if: always()
        run: |
          echo "### Site deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${GITHUB_SHA:0:7}\` — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
