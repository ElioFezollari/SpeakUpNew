name: Deploy to Droplet

# ALTERNATIVE to App Platform: build here, rsync `dist/` to a Droplet running
# nginx. Disabled by default — remove the `if: false` on the job to enable.
#
# Required repository secrets:
#   SSH_PRIVATE_KEY  — key authorised on the Droplet
#   SSH_HOST         — droplet IP or hostname
#   SSH_USER         — deploy user
#   DEPLOY_PATH      — e.g. /var/www/speakup
#   BLOG_API_URL     — admin posts endpoint
#   BLOG_API_TOKEN   — admin read token

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [publish-blog]

jobs:
  deploy:
    if: false # ← remove this line to enable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BLOG_API_URL: ${{ secrets.BLOG_API_URL }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          SITE_URL: https://speakup.al

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to Droplet
        # --delete-after so the old files are removed only once the new ones
        # have transferred; the site is never briefly half-deployed.
        run: |
          rsync -avz --delete-after \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
